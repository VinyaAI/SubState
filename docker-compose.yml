services:
  postgres:
    image: postgres:16
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=5
      - -c
      - max_wal_senders=5
    environment:
      POSTGRES_USER: substate
      POSTGRES_PASSWORD: substate
      POSTGRES_DB: substate
    ports:
      - "5432:5432"
    volumes:
      - ./deploy/compose/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U substate -d substate"]
      interval: 2s
      timeout: 5s
      retries: 15

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  location-producer:
    image: redpandadata/redpanda:v24.2.18
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rpk topic create driver-locations --brokers=redpanda:9092 || true
        while true; do
          seq=$$(date +%s)
          echo "{\"driver_id\":\"1\",\"location\":{\"lat\":36.16,\"lng\":-86.78},\"sequence\":$$seq}" \
            | rpk topic produce driver-locations --brokers=redpanda:9092
          sleep 5
        done
    restart: unless-stopped

  substate:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://substate:substate@postgres:5432/substate
      SCHEMA_PATH: /config/schema.yaml
      CDS_SCHEMA: public
      CDS_POLL_MS: "1000"
      POSTGRES_FOLLOW: auto
      KAFKA_BROKERS: redpanda:9092
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info
    volumes:
      - ./deploy/compose/schema.yaml:/config/schema.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
