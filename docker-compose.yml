services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: substate
      POSTGRES_PASSWORD: substate
      POSTGRES_DB: substate
    ports:
      - "5432:5432"
    volumes:
      - ./deploy/compose/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U substate -d substate"]
      interval: 2s
      timeout: 5s
      retries: 15

  substate:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://substate:substate@postgres:5432/substate
      SCHEMA_PATH: /config/schema.yaml
      CDS_SCHEMA: public
      CDS_POLL_MS: "1000"
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info
    volumes:
      - ./deploy/compose/schema.yaml:/config/schema.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
