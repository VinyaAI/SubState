# Compose demo: Postgres (CDC) + Kafka location + HTTP escape hatch.
#
# Clients subscribe to logical entity `driver`.
# `location` is owned by the Kafka `gps` source (topic driver-locations).

entities:
  driver:
    identity:
      field: id
    sources:
      postgres:
        type: postgres
        table: drivers
      gps:
        type: kafka
        topic: driver-locations
        entity_key: driver_id
      http:
        type: http
    fields:
      id:
        source: postgres
        mode: transactional
      name:
        source: postgres
        mode: transactional
      status:
        source: postgres
        mode: transactional
      region:
        source: postgres
        mode: transactional
      created_at:
        source: postgres
        mode: transactional
      location:
        source: gps
        mode: latest_value
        ordering: sequence
